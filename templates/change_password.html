```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Campus Skill Exchange</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5fb;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-card {
            width: 90%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(20, 50, 90, 0.12);
        }

        .password-card h2 {
            color: #173b75;
            margin: 0 0 10px;
            font-size: 27px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #26364b;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5deeb;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3478d4;
            box-shadow: 0 0 0 3px rgba(52, 120, 212, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #2459a9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #173b75;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error {
            background: #feecec;
            color: #b42318;
        }

        .success {
            background: #e8f7ed;
            color: #187443;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2459a9;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .password-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="password-card">
        <h2>Change Password</h2>
        <p class="subtitle">
            Update your password to keep your account secure.
        </p>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Update Password
            </button>
        </form>

        <a class="back-link" href="{{ url_for('profile') }}">
            ← Back to Profile
        </a>
    </div>
</body>
</html>
```
